name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (mvn verify + spotless + jacoco)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with common/jwt-support submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (spotless:check + tests + jacoco)
        # 依赖源 = 仓内 .mvn/settings.xml（内网 Nexus），不再显式 -s。
        # ⚠️ GitHub 托管 runner 到不了内网 Nexus（nexus.ts.huntercat.cn）——
        #    本 workflow 只在能访问内网的 self-hosted runner 上有意义；真正生效的 CI 是 .gitlab-ci.yml。
        run: mvn -B -ntp -DskipITs -f pom.xml verify
