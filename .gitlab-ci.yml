# lieshou-cloud-admin-services 质量门禁 + 制品分发（GitLab CI · 2026-09）
# 前置：huntercat-digital 组级 docker runner（tags: java,wqc）；runner 已 map nexus.ts.huntercat.cn
# 门 = services 子树的 mvn verify（含 spotless check）——不留"跳过格式"的假绿
stages: [verify, deploy]

variables:
  # 内网 Caddy 自签证书不在 job 容器信任库 → 放行 git/HTTPS（对齐 lieshou-framework、gateway-services）
  GIT_SSL_NO_VERIFY: "true"
  # ⚠️ 不用 GitLab 的隐式递归：它在 before_script 之前执行、**不 sync URL**，而 .gitmodules 里是
  #    ssh://git@gitlab.ts.huntercat.cn:22220/... （job 容器没有 ssh 客户端也没私钥）
  #    → 只要子模块 commit 一变就必须真 fetch，立刻报 "cannot run ssh: No such file or directory"
  #    （pin 不动时靠复用构建目录里的旧 checkout 蒙过去，2026-09-14 实踩）。必须自己重写成 CI_JOB_TOKEN 的 HTTPS。
  GIT_SUBMODULE_STRATEGY: none

default:
  image: maven:3.9-eclipse-temurin-21
  tags: [java, wqc]
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ts.huntercat.cn/huntercat-digital/".insteadOf "ssh://git@gitlab.ts.huntercat.cn:22220/huntercat-digital/"
    - git submodule sync --recursive
    - git submodule update --init --recursive

verify:
  stage: verify
  timeout: 30m
  script:
    - java -version
    # Nexus 由 Caddy 内部 CA 签发，job 容器 JDK 不认 → 先导入仓内公开根证书（非私钥）
    - keytool -importcert -noprompt -trustcacerts -alias caddy-root-2026 -file .ci/caddy-root.crt -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
    # 真门：依赖源必须是内网 Nexus（.mvn/settings.xml 若失效，Maven 会静默回落公网 repo.maven.apache.org）
    - mvn -B -ntp help:effective-settings -Doutput=/tmp/eff-settings.xml -q
    - grep -q "nexus.ts.huntercat.cn/repository/maven-public" /tmp/eff-settings.xml && echo "✅ 依赖源 = 内网 Nexus maven-public"
    # framework 是 submodule（上游 lieshou-framework 的代码，pin = v0.3.1）：先 install 进本地 .m2 供解析。
    # 跳过上游测试（framework 有自己的 CI 与 tag pipeline），本仓的门在下一行。
    - mvn -B -ntp -DskipTests install
    # 本仓门 = services 子树的 spotless check + 测试
    - mvn -B -ntp -f services/pom.xml verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# 制品分发：main push → Nexus maven-snapshots（本仓版本 0.0.1-SNAPSHOT）
# 只发 services 子树：framework 走 submodule 源码，先 install 进本地 .m2 供解析，绝不上 Nexus
#   （framework 自己的制品由 lieshou-framework 仓的 tag pipeline 发，勿在此重复/覆盖）
# 凭证：.mvn/settings.xml 用 ${env.NEXUS_USER}/${env.NEXUS_PASS} 插值，这里从 CI 变量导出，不落仓库
# 依赖解析同样走 Nexus：不需要 -s，仓内 .mvn/maven.config 已在仓库根自动加载
deploy:
  stage: deploy
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # 内部 CA 进 JVM 信任库（job 容器不认 Caddy 自签 CA）
    - keytool -importcert -noprompt -trustcacerts -alias caddy-root-2026 -file .ci/caddy-root.crt -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
    - export NEXUS_USER="$NEXUS_DEPLOY_USER" NEXUS_PASS="$NEXUS_DEPLOY_PASS"
    - mvn -B -ntp help:effective-settings -Doutput=/tmp/eff-settings.xml -q
    - grep -q "nexus.ts.huntercat.cn/repository/maven-public" /tmp/eff-settings.xml && echo "✅ 依赖源 = 内网 Nexus maven-public"
    - mvn -B -ntp -DskipTests install
    - mvn -B -ntp -f services/pom.xml deploy
